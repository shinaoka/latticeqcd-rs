[workspace]
members = ["crates/gaugefields", "crates/wilsonloop"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/shinaoka/latticeqcd-rs"

[workspace.dependencies]
num-complex = "0.4"
rand = { version = "0.8", default-features = false }
rand_xoshiro = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
npyz = { version = "0.8", features = ["complex"] }
quick-xml = "0.37"
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "c942129974b544225ed963414d7be1300980f901", default-features = false }
tenferro-runtime = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "c942129974b544225ed963414d7be1300980f901", default-features = false, features = ["cpu-faer"] }
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "c942129974b544225ed963414d7be1300980f901", default-features = false, features = ["cpu-faer"] }
tenferro-ad = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "c942129974b544225ed963414d7be1300980f901", default-features = false, features = ["cpu-faer"] }
tenferro-internal-ops = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "c942129974b544225ed963414d7be1300980f901", default-features = false, features = ["autodiff"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
